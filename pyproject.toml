[project]
name = "sloth-organizer"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlmodel",
    "aiofiles",
    "websockets",
    "pypdf",
    "python-docx",
    "openpyxl",
    "openai",
    "pydantic-settings",
]

[project.scripts]
sloth-organizer = "sloth_organizer.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
sloth_organizer = ["static/**/*"]
